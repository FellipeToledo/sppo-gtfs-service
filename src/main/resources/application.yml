spring:
  application:
    name: sppo-gtfs-service

server:
  port: 8080

sppo:
  gtfs:
    bigquery:
      # GCP project used to run/bill the queries (usually your own project, not rj-smtr).
      project-id: ${GCP_PROJECT_ID:}
      viagem-planejada-table: ${GTFS_VIAGEM_TABLE:rj-smtr.planejamento.viagem_planejada_dia}
      shapes-geom-table: ${GTFS_SHAPES_TABLE:rj-smtr.planejamento.shapes_geom}
      location: ${BIGQUERY_LOCATION:US}
      planned-lookback-days: ${GTFS_PLANNED_LOOKBACK_DAYS:14}
    filter:
      modos: ${GTFS_MODOS:Ônibus}   # SPPO = buses; comma-separated to add more
    reload:
      on-startup: true
      cron: "0 0 4 * * *"           # daily 04:00 UTC
      # Startup load only: a transient BigQuery failure would otherwise leave the index
      # empty until the cron. Readiness flips after this finishes, so keep the worst case
      # (attempts x (load + backoff)) inside the healthcheck start-period.
      startup-attempts: ${GTFS_RELOAD_STARTUP_ATTEMPTS:3}
      startup-backoff: ${GTFS_RELOAD_STARTUP_BACKOFF:10s}   # doubles per attempt
    api:
      default-format: encoded
      api-key: ${GTFS_API_KEY:}
      admin-key: ${GTFS_ADMIN_KEY:}
      cors-allowed-origins: ${GTFS_CORS_ORIGINS:}
    feed:
      source: "SMTR/BigQuery rj-smtr.planejamento"
    cache:
      max-size: 5000
      ttl-minutes: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: sppo-gtfs-service

logging:
  level:
    com.fajtech.sppogtfs: INFO
