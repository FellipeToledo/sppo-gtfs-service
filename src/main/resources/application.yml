spring:
  application:
    name: sppo-gtfs-service
  datasource:
    url: ${GTFS_DB_URL:jdbc:postgresql://localhost:5432/gtfs}
    username: ${GTFS_DB_USER:gtfs}
    password: ${GTFS_DB_PASSWORD:gtfs}
    hikari:
      maximum-pool-size: ${GTFS_DB_POOL_SIZE:5}
      read-only: true
  jpa:
    open-in-view: false
    hibernate:
      # DB is pre-populated with the SMTR GTFS; this service never mutates the schema.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

sppo:
  gtfs:
    filter:
      route-types: [3]        # SPPO = buses only
      exclude-brt: true
      brt-agency-ids: []
      brt-line-prefixes: []
    reload:
      on-startup: true
      cron: "0 0 4 * * *"     # daily 04:00 UTC
    api:
      default-format: encoded
      api-key: ${GTFS_API_KEY:}
      admin-key: ${GTFS_ADMIN_KEY:}
      cors-allowed-origins: ${GTFS_CORS_ORIGINS:}
    feed:
      source: "SMTR/data.rio"
      fallback-id: ${GTFS_FEED_FALLBACK_ID:}
    cache:
      max-size: 5000
      ttl-minutes: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: sppo-gtfs-service

logging:
  level:
    com.fajtech.sppogtfs: INFO
