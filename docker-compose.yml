# Local run of the service.
#
# By default this runs the 'demo' profile (in-memory sample loader) so it starts with no
# BigQuery credentials. To run against real BigQuery, set SPRING_PROFILES_ACTIVE to empty,
# provide a service-account key, and set the project — see the commented block below.
services:
  gtfs-service:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: demo
      # --- Real BigQuery (comment out the line above and use these) ---
      # GCP_PROJECT_ID: your-billing-project
      # GOOGLE_APPLICATION_CREDENTIALS: /secrets/sa.json
      # GTFS_VIAGEM_TABLE: rj-smtr.planejamento.viagem_planejada_dia
      # GTFS_SHAPES_TABLE: rj-smtr.planejamento.shapes_geom
      # BIGQUERY_LOCATION: US
      # GTFS_API_KEY: change-me
      # GTFS_ADMIN_KEY: change-me-admin
    # volumes:
    #   - ./secrets/sa.json:/secrets/sa.json:ro
    ports:
      - "8080:8080"
