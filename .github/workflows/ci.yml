name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` roda os testes (surefire) e já empacota o jar — não precisa de um
      # segundo `package`.
      - name: Build and test
        run: mvn --batch-mode verify
